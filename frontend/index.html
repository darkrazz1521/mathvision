<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MathVision — AI Handwritten Mathematical Recognition Platform</title>
    <meta name="description" content="Advanced Handwritten Mathematical Expression Recognition (HMER) IDE with DenseNet-121, Transformer cross-attention explainability, and symbolic verification." />
    <!-- Fonts: Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!-- KaTeX CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGExxAU4Vm5HtQPsZOrV950uWq" crossorigin="anonymous" />
    <script>
      (function() {
        var removeNetlify = function() {
          var targets = document.querySelectorAll(
            'netlify-drawer, [data-netlify-drawer], #netlify-drawer, [class*="netlify-drawer"], [id*="netlify-drawer"], div[id^="netlify-"], iframe[src*="netlify"]'
          );
          for (var i = 0; i < targets.length; i++) {
            targets[i].remove();
          }
        };
        if (typeof MutationObserver !== 'undefined') {
          new MutationObserver(removeNetlify).observe(document.documentElement, { childList: true, subtree: true });
        }
        window.addEventListener('DOMContentLoaded', removeNetlify);
        window.addEventListener('load', removeNetlify);
      })();
    </script>
  </head>
  <body class="bg-[#090B10] text-[#F1F5F9] font-sans antialiased selection:bg-[#8B7CFF]/30 selection:text-[#F1F5F9]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
