[build]
  base = "frontend"
  publish = "dist"
  command = "npm run build"

# Disable Netlify drawer, collaborative feedback, and code injection
[build.processing]
  skip_processing = true

[build.environment]
  NETLIFY_DRAWER = "false"
  DISABLE_NETLIFY_DRAWER = "true"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
